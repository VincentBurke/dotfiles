# Font
font_family JetBrains Mono
bold_font auto
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 14.0

# Text Rendering
text_composition_strategy 1.0 0

# Cursor (bar)
cursor_shape beam

# Padding (kitty uses points; 10 is close to Ghostty’s 10px feel)
window_padding_width 10
:contentReference[oaicite:1]{index=1}

# Transparency + blur (blur only applies when opacity < 1)
background_opacity 0.92
background_blur 20
:contentReference[oaicite:2]{index=2}

# Title bar color matches terminal background (keeps traffic-light buttons)
macos_titlebar_color background
:contentReference[oaicite:3]{index=3}

# Treat Option as Alt (matches your Ghostty setting)
macos_option_as_alt both
:contentReference[oaicite:4]{index=4}

# Clipboard: allow writes; ask on reads (matches Ghostty “read=ask/write=allow”)
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
:contentReference[oaicite:5]{index=5}

# Paste protection (closest kitty equivalent)
paste_actions quote-urls-at-prompt,confirm,confirm-if-large,replace-dangerous-control-codes
:contentReference[oaicite:6]{index=6}

# One Dark Pro colors
foreground #ABB2BF
background #282C34
selection_foreground #282C34
selection_background #ABB2BF

cursor #ABB2BF
cursor_text_color #282C34

url_color #ABB2BF

active_tab_foreground #3F4451
active_tab_background #D7DAE0
inactive_tab_foreground #ABB2BF
inactive_tab_background #282C34

color0  #3F4451
color8  #4F5666
